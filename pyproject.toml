[project]
name = "travel-pipelines"
version = "0.1.0"
description = "Travel data ETL pipelines (DuckDB → Parquet → PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.3",
    "pyarrow>=18.1.0",
    "httpx>=0.28.1",
    "typer>=0.15.1",
    "rich>=13.9.4",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]
db = [
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
